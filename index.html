<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="profile.png" alt="Arv" class="profile-img">

        <div class="text-data">
            <span class="name">Arv Gupta</span>
            <span class="course">B.tech     CS AI&ML</span>
        </div>
        <div class="media-buttons">
            <a href="https://www.linkedin.com/in/arv-gupta-b69506431/" target="_blank"    style="background:blue;" class="link">
               <i class='bx bxl-linkedin'></i> 
            </a>    
            <a href="https://github.com/Arv-Gupta0611" target="_blank" style="background: black;" class="link">
               <i class='bx bxl-github'></i> 
            </a>

            <a href="mailto:arv.v.gupta@gmail.com" style="background: red;" class="link">
               <i class='bx bx-envelope'></i> 
            </a>

            <a href="#" style="background: palevioletred;" class="link">
                <i class='bx bxl-instagram'></i>
            </a>

            <a href="#" style="background: green;" class="link">
                <i class='bx bxl-whatsapp'></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Connect</button>
        </div>
    </div>
</body>
</html>
